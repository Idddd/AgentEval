services:
  tali-ui-demo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 10s
