[client]
# This is an end-user demo, not a Streamlit development surface. Hide developer
# actions such as Clear cache (and its keyboard shortcut) from viewers.
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#4339FF"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#191A1B"
font = "sans-serif"
