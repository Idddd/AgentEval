# kind cluster for sandboxed eval runs.
# The default CNI (kindnet) does NOT enforce NetworkPolicy, so it is disabled
# and Calico is installed by `make kind-up`; the node stays NotReady until
# Calico is applied, which is expected.
#
# Registry access is configured per node via /etc/containerd/certs.d
# (deploy/kind/registry.sh). containerd 2.x rejects `mirrors` in a config
# patch when `config_path` is set, which kind sets by default.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
