# kind cluster for sandboxed eval runs.
# The default CNI (kindnet) does NOT enforce NetworkPolicy, so it is disabled
# and Calico is installed by `make kind-up`. The containerd patch lets pods
# pull images pushed to the local registry at localhost:5001.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]
nodes:
  - role: control-plane
