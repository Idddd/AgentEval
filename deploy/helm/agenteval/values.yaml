replicaCount: 1

image:
  repository: ghcr.io/idddd/agenteval
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  existingClaim: ""
  size: 5Gi
  storageClass: ""

demoCredentials:
  existingSecret: ""
  postgresUser: tasklattice
  postgresPassword: development
  postgresDatabase: tasklattice

publicUrl: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

extraEnv: []

nameOverride: ""
fullnameOverride: ""
