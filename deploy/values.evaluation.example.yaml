# Copy outside the source repository and fill in the actual Evaluate API URL
# when configuring the running deployment. Keep Tokens in Secrets.
marketplace:
  evaluationUrl: ""
  # Optional. An explicitly saved fallback can be selected from V3 Connections.
  # Leave empty if the deployment URL is the only approved Evaluate backend.
  evaluationAllowedUrls: []
  evaluationBindings: {}
  # evaluationBindings:
  #   my-guardrail@2: my-evaluation-suite
  # Only when required by Evaluate; default standalone project: individual.
  evaluationProjectId: ""
  # evaluationTokenSecret: marketplace-evaluate
  # evaluationTokenKey: MARKETPLACE_EVALUATION_TOKEN
  # If configured, the Token is pinned to evaluationUrl. To switch its backend
  # or credentials, change the deployment values and Secret together.
