name: AgentEval image and Helm chart

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: agenteval-artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build AgentEval image and Chart
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image and Chart metadata
        id: artifact
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="${registry}/agenteval"
          short_sha="${GITHUB_SHA::12}"
          immutable_tag="sha-${short_sha}"
          chart_version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          tags=("${image}:${immutable_tag}")

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tags+=("${image}:pr-${PR_NUMBER}")
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag '${GITHUB_REF_NAME}' must use vMAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            chart_version="${GITHUB_REF_NAME#v}"
            tags+=("${image}:${chart_version}" "${image}:${GITHUB_REF_NAME}")
          else
            branch="${GITHUB_REF_NAME,,}"
            branch="${branch//\//-}"
            branch="${branch//_/-}"
            tags+=("${image}:${branch}")
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              chart_version="0.1.0-main.${GITHUB_RUN_NUMBER}"
              tags+=("${image}:latest")
            fi
          fi

          {
            echo "image=${image}"
            echo "immutable_tag=${immutable_tag}"
            echo "chart_version=${chart_version}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and optionally publish the all-in-one image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.artifact.outputs.tags }}
          build-args: |
            AGENTEVAL_CHART_VERSION=${{ steps.artifact.outputs.chart_version }}
            AGENTEVAL_IMAGE_REPOSITORY=${{ steps.artifact.outputs.image }}
            AGENTEVAL_IMAGE_TAG=${{ steps.artifact.outputs.immutable_tag }}
          labels: |
            org.opencontainers.image.title=AgentEval
            org.opencontainers.image.description=Self-contained AgentEval Demo with PostgreSQL, API, Web, and Helm Chart
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agenteval
          cache-to: type=gha,mode=max,scope=agenteval
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Pull the published immutable image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.artifact.outputs.image }}
          IMAGE_TAG: ${{ steps.artifact.outputs.immutable_tag }}
        run: docker pull "${IMAGE}:${IMAGE_TAG}"

      - name: Extract and validate the embedded Chart
        id: chart
        shell: bash
        env:
          IMAGE: ${{ steps.artifact.outputs.image }}
          IMAGE_TAG: ${{ steps.artifact.outputs.immutable_tag }}
        run: |
          set -euo pipefail
          rm -rf .artifacts/helm
          mkdir -p .artifacts/helm

          container_id="$(docker create "${IMAGE}:${IMAGE_TAG}")"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/opt/agenteval/helm/." .artifacts/helm

          mapfile -t packages < <(find .artifacts/helm/packages -maxdepth 1 -name 'agenteval-*.tgz' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected one embedded AgentEval Chart package, found ${#packages[@]}." >&2
            exit 1
          fi

          helm lint .artifacts/helm/agenteval
          helm template agenteval "${packages[0]}" --namespace agenteval >/dev/null
          echo "package=${packages[0]}" >> "${GITHUB_OUTPUT}"

      - name: Log Helm in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish the embedded Helm Chart
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag')
        shell: bash
        env:
          CHART_PACKAGE: ${{ steps.chart.outputs.package }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm push "${CHART_PACKAGE}" "oci://ghcr.io/${owner}/charts"
