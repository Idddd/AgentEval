name: Container images

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: agenteval-api
            context: .
            dockerfile: ./Dockerfile
          - component: web
            image: agenteval-web
            context: ./web
            dockerfile: ./web/Dockerfile.control

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and tags
        id: image
        shell: bash
        env:
          COMPONENT_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="${registry}/${COMPONENT_IMAGE}"
          short_sha="${GITHUB_SHA::12}"
          tags=("${image}:sha-${short_sha}")

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tags+=("${image}:pr-${{ github.event.pull_request.number }}")
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag '${GITHUB_REF_NAME}' must use the form vMAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            tags+=("${image}:${version}" "${image}:${GITHUB_REF_NAME}")
          else
            branch="${GITHUB_REF_NAME,,}"
            branch="${branch//\//-}"
            branch="${branch//_/-}"
            tags+=("${image}:${branch}")
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              tags+=("${image}:latest")
            fi
          fi

          {
            echo "name=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=AgentEval ${{ matrix.component }}
            org.opencontainers.image.description=AgentEval ${{ matrix.component }} service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agenteval-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=agenteval-${{ matrix.component }}
          provenance: mode=max
          sbom: true
